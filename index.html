<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ĐƠN TUYỂN TOKUTEI GINO &amp; KỸ SƯ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root {
      --bg: #f4f7fa;
      --surface: #ffffff;
      --surface-muted: #f8fafc;
      --primary: #0f766e;
      --primary-light: #e6f4f1;
      --accent: #0284c7;
      --detail-bg: #eef2ff;
      --detail-text: #3730a3;
      --detail-border: #c7d2fe;
      --danger: #b91c1c;
      --danger-light: #fee2e2;
      --open-bg: #dcfce7;
      --open-text: #15803d;
      --closed-bg: #e2e8f0;
      --closed-text: #334155;
      --text: #0f172a;
      --muted: #64748b;
      --border: #dbe3ec;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Be Vietnam Pro", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
      overflow-x: hidden;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
    }

    header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
    }

    .brand-block .site-brand {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2px;
    }

    .brand-block h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.35;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      margin-left: auto;
    }

    .lang-bar {
      display: inline-flex;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }

    .lang-btn {
      background: transparent;
      color: var(--text);
      border: none;
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .lang-btn.active {
      background: var(--primary);
      color: #ffffff;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .category-nav {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .cat-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cat-tab-btn {
      background: var(--surface-muted);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 9px;
      font-size: 0.88rem;
      font-weight: 700;
    }

    .cat-tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .cat-picker-panel {
      display: none;
      width: 100%;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-top: 6px;
      max-height: 360px;
      overflow-y: auto;
    }

    .cat-picker-panel.open {
      display: block;
    }

    .cat-group-title {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--primary);
      margin: 8px 0 6px;
    }

    .cat-group-title:first-child {
      margin-top: 0;
    }

    .cat-chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .cat-chip {
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 7px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .cat-chip.selected {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
      font-weight: 700;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
      font-size: 0.88rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    button {
      padding: 8px 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s ease;
    }

    button:hover {
      opacity: 0.92;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .btn-secondary {
      background: var(--primary-light);
      color: var(--primary);
      border-color: #99f6e4;
    }

    .btn-admin {
      background: #1e293b;
      color: #ffffff;
      border-color: #1e293b;
    }

    .btn-update {
      background: #0369a1;
      color: #ffffff;
      border-color: #0369a1;
    }

    .btn-detail {
      background: var(--detail-bg);
      color: var(--detail-text);
      border-color: var(--detail-border);
    }

    .btn-snap {
      background: #fef3c7;
      color: #92400e;
      border-color: #fde68a;
    }

    .btn-danger-sm {
      background: var(--danger-light);
      color: var(--danger);
      border-color: #fecaca;
      padding: 5px 9px;
      font-size: 0.78rem;
    }

    .filters {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: 1.35fr 1fr 1fr 0.95fr;
      gap: 10px;
      position: relative;
    }

    .filter-control {
      width: 100%;
      padding: 8px 11px;
      background: #ffffff;
      color: var(--text);
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .location-dropdown-wrapper {
      position: relative;
    }

    .location-panel {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.14);
      padding: 10px;
      max-height: 380px;
      overflow-y: auto;
      z-index: 80;
    }

    .location-panel.open {
      display: block;
    }

    .loc-all-btn {
      width: 100%;
      text-align: left;
      background: var(--surface-muted);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 10px;
      margin-bottom: 6px;
      font-size: 0.84rem;
    }

    .region-item {
      border-bottom: 1px solid #f1f5f9;
      padding: 3px 0;
    }

    .region-item:last-child {
      border-bottom: none;
    }

    .region-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .region-select-btn {
      flex: 1;
      text-align: left;
      background: transparent;
      color: var(--text);
      border: none;
      padding: 5px 6px;
      font-size: 0.84rem;
      font-weight: 700;
      justify-content: flex-start;
    }

    .region-select-btn.selected,
    .pref-btn.selected,
    .loc-all-btn.selected {
      background: var(--primary-light);
      color: var(--primary);
    }

    .region-toggle-btn {
      background: var(--surface-muted);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 3px 8px;
      font-size: 0.78rem;
      min-width: 28px;
    }

    .pref-list {
      display: none;
      padding: 3px 0 6px 12px;
      flex-direction: column;
      gap: 2px;
    }

    .pref-list.expanded {
      display: flex;
    }

    .pref-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--text);
      border: none;
      padding: 4px 8px;
      font-size: 0.82rem;
      font-weight: 500;
      justify-content: flex-start;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      overflow-wrap: anywhere;
    }

    .card.is-closed {
      background: #f8fafc;
      opacity: 0.85;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .card-title-compact {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-open {
      background: var(--open-bg);
      color: var(--open-text);
    }

    .status-closed {
      background: var(--closed-bg);
      color: var(--closed-text);
    }

    .compact-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.86rem;
    }

    .compact-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
    }

    .compact-row strong {
      font-weight: 700;
      color: #0f172a;
    }

    .nat-badge-list {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }

    .country-flag-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 22px;
      padding: 0 7px 0 4px;
      border-radius: 6px;
      background: #ffffff;
      border: 1px solid var(--border);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text);
      white-space: nowrap;
      line-height: 1;
    }

    .country-flag-svg {
      width: 16px;
      height: 11px;
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.14);
      flex-shrink: 0;
      display: block;
    }

    .admin-card-bar {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .admin-card-bar select {
      padding: 5px 8px;
      font-size: 0.8rem;
    }

    .card-actions-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      align-items: stretch;
      width: 100%;
    }

    .card-actions-row button {
      width: 100%;
      min-width: 0;
      padding: 8px 4px;
      font-size: clamp(0.68rem, 0.9vw, 0.76rem);
      line-height: 1.2;
      white-space: nowrap;
      letter-spacing: -0.015em;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 120;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border-radius: 14px;
      width: 100%;
      max-width: 840px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 22px 48px rgba(15, 23, 42, 0.25);
    }

    .modal-sm {
      max-width: 440px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    .modal-brand {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .modal-head h3 {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--primary);
      margin-top: 2px;
    }

    .helper-box {
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .detail-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 14px;
      font-size: 0.86rem;
    }

    .detail-table th,
    .detail-table td {
      border: 1px solid var(--border);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }

    .detail-table th {
      width: 26%;
      background: var(--surface-muted);
      font-weight: 700;
    }

    .modal-foot {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .form-field {
      margin-bottom: 10px;
    }

    .form-field label {
      display: block;
      font-size: 0.83rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .form-field input,
    .form-field select,
    .form-field textarea {
      width: 100%;
      padding: 8px 10px;
      background: #ffffff;
      color: var(--text);
    }

    .toast {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0f172a;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.86rem;
      z-index: 160;
    }

    #printOnlyArea {
      display: none;
    }

    @media (max-width: 900px) {
      .filters {
        grid-template-columns: 1fr 1fr;
      }
      .header-right {
        align-items: stretch;
        width: 100%;
        margin-left: 0;
      }
      .top-actions {
        justify-content: stretch;
      }
      .top-actions button {
        flex: 1;
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 10px;
      }
      .filters,
      .grid,
      .form-grid-2 {
        grid-template-columns: 1fr;
      }
      .card-actions-row {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 4px;
      }
      .card-actions-row button {
        font-size: 0.63rem;
        padding: 7px 3px;
        letter-spacing: -0.02em;
      }
    }

    @media print {
      @page {
        margin: 12mm;
      }
      body > .container,
      body > .modal-backdrop,
      body > .toast {
        display: none !important;
      }
      #printOnlyArea {
        display: block !important;
        background: #ffffff;
        color: #0f172a;
        font-family: "Be Vietnam Pro", "Noto Sans JP", sans-serif;
      }
      .print-doc-header {
        border-bottom: 2px solid #0f766e;
        padding-bottom: 8px;
        margin-bottom: 12px;
      }
      .print-doc-brand {
        font-size: 11px;
        font-weight: 700;
        color: #0284c7;
        text-transform: uppercase;
      }
      .print-doc-title {
        font-size: 16px;
        font-weight: 700;
        color: #0f766e;
        margin-top: 2px;
      }
      .print-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11.5px;
        line-height: 1.45;
      }
      .print-table th,
      .print-table td {
        border: 1px solid #cbd5e1;
        padding: 6px 9px;
        text-align: left;
        vertical-align: top;
      }
      .print-table th {
        width: 26%;
        background: #f8fafc;
        font-weight: 700;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand-block">
        <div class="site-brand" id="siteBrand">Minami Kyujn Share</div>
        <h1 id="pageTitle">ĐƠN TUYỂN TOKUTEI GINO &amp; KỸ SƯ</h1>
      </div>

      <div class="header-right">
        <div class="lang-bar" role="group" aria-label="Language switcher">
          <button type="button" class="lang-btn active" data-lang="vi" onclick="switchLang('vi')">Tiếng Việt</button>
          <button type="button" class="lang-btn" data-lang="ja" onclick="switchLang('ja')">日本語</button>
        </div>

        <div class="top-actions">
          <button type="button" id="updateBtn" class="btn-update" onclick="handleUpdateClick()"></button>
          <button type="button" id="adminAuthBtn" class="btn-admin" onclick="handleAdminAuthClick()"></button>
          <button type="button" id="resetFilterBtn" class="btn-secondary" onclick="resetFilters()"></button>
        </div>
      </div>
    </header>

    <nav class="category-nav" aria-label="Primary job categories">
      <div class="cat-tabs">
        <button type="button" id="tabTokutei" class="cat-tab-btn" onclick="toggleCategoryPicker('tokutei')"></button>
        <button type="button" id="tabEngineer" class="cat-tab-btn" onclick="toggleCategoryPicker('engineer')"></button>
      </div>
      <div id="activeCategoryIndicator" style="font-size:0.84rem;color:var(--muted);font-weight:600;"></div>

      <div id="categoryPickerPanel" class="cat-picker-panel"></div>
    </nav>

    <section class="filters" aria-label="Job filters">
      <input id="searchInput" type="text" oninput="renderJobs()" />

      <select id="industryFilter" onchange="onIndustryDropdownChange(this.value)"></select>

      <div class="location-dropdown-wrapper" id="locationDropdownWrapper">
        <button type="button" id="locationTrigger" class="filter-control" onclick="toggleLocationPanel(event)">
          <span id="locationTriggerLabel"></span>
          <span>▾</span>
        </button>
        <div id="locationPanel" class="location-panel"></div>
      </div>

      <select id="salaryFilter" onchange="renderJobs()"></select>
    </section>

    <main id="jobGrid" class="grid"></main>
  </div>

  <div id="detailModal" class="modal-backdrop" onclick="handleBackdropClick(event, 'detailModal')">
    <div id="detailModalBox" class="modal" role="dialog" aria-modal="true" aria-labelledby="detailModalTitle">
      <div class="modal-head">
        <div>
          <div class="modal-brand">Minami Kyujn Share</div>
          <h3 id="detailModalTitle">Thông Tin Đơn Tuyển</h3>
        </div>
        <button type="button" id="closeDetailBtn" class="btn-secondary" onclick="closeModal('detailModal')"></button>
      </div>
      <div id="detailModalBody"></div>
      <div class="modal-foot">
        <button type="button" id="detailSnapBtn" class="btn-snap" onclick="captureDetailImage()"></button>
        <button type="button" id="detailCopyBtn" class="btn-primary" onclick="copyCurrentDetailJob()"></button>
        <button type="button" id="detailPrintBtn" class="btn-secondary" onclick="printSingleJob(activeDetailJob?.code)"></button>
      </div>
    </div>
  </div>

  <div id="loginModal" class="modal-backdrop" onclick="handleBackdropClick(event, 'loginModal')">
    <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="loginModalTitle">
      <div class="modal-head">
        <div>
          <div class="modal-brand">Minami Kyujn Share</div>
          <h3 id="loginModalTitle"></h3>
        </div>
        <button type="button" id="closeLoginBtn" class="btn-secondary" onclick="closeModal('loginModal')"></button>
      </div>
      <div class="helper-box" id="adminAuthHint"></div>
      <div class="form-field">
        <label id="adminPassLabel" for="adminPassInput"></label>
        <input id="adminPassInput" type="password" onkeydown="if(event.key==='Enter') verifyAdminPass()" />
      </div>
      <div class="modal-foot">
        <button type="button" id="confirmLoginBtn" class="btn-primary" onclick="verifyAdminPass()"></button>
      </div>
    </div>
  </div>

  <div id="updateManagerModal" class="modal-backdrop" onclick="handleBackdropClick(event, 'updateManagerModal')">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="updateModalTitle">
      <div class="modal-head">
        <div>
          <div class="modal-brand">Minami Kyujn Share</div>
          <h3 id="updateModalTitle"></h3>
        </div>
        <button type="button" id="closeUpdateManagerBtn" class="btn-secondary" onclick="closeModal('updateManagerModal')"></button>
      </div>
      <div class="helper-box" id="updateGuideHint"></div>
      <div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
        <button type="button" id="openAddFromManagerBtn" class="btn-primary" onclick="openEditorModal()"></button>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button type="button" id="changePasscodeBtn" class="btn-secondary" onclick="promptChangePasscode()"></button>
          <button type="button" id="restoreDefaultBtn" class="btn-danger-sm" onclick="restoreDefaultJobs()"></button>
        </div>
      </div>
      <div id="updateJobListBody"></div>
    </div>
  </div>

  <div id="editorModal" class="modal-backdrop" onclick="handleBackdropClick(event, 'editorModal')">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editorModalTitle">
      <div class="modal-head">
        <div>
          <div class="modal-brand">Minami Kyujn Share</div>
          <h3 id="editorModalTitle"></h3>
        </div>
        <button type="button" id="closeEditorBtn" class="btn-secondary" onclick="closeModal('editorModal')"></button>

    function getSupabaseHeaders(extra = {}) {
      return {
        "Content-Type": "application/json",
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        ...extra
      };
    }

    function makeJobId(job) {
      const base = `${job.code || "job"}-${job.prefecture || "jp"}-${job.industry || "gen"}`
        .toLowerCase()
        .replace(/[^a-z0-9-_]+/g, "-");
      return base || `job-${Date.now()}`;
    }

    function serializeJobForDb(job) {
      const id = job.id || makeJobId(job);
      return {
        id,
        code: job.code,
        category_type: job.categoryType || "tokutei",
        status: job.status === "Đóng đơn" ? "Đóng đơn" : "Đang tuyển",
        company: job.company || "Minami Kyujn Share",
        industry: job.industry || "Kaigo",
        prefecture: job.prefecture || "Tokyo",
        link: job.link || "",
        i18n: job.i18n || { vi: {}, ja: {} },
        updated_at: new Date().toISOString()
      };
    }

    function deserializeJobFromDb(row) {
      return {
        id: row.id,
        code: row.code,
        categoryType: row.category_type || "tokutei",
        status: row.status === "Đóng đơn" ? "Đóng đơn" : "Đang tuyển",
        company: row.company || "Minami Kyujn Share",
        industry: row.industry || "Kaigo",
        prefecture: row.prefecture || "Tokyo",
        link: row.link || "",
        i18n: row.i18n && typeof row.i18n === "object"
          ? row.i18n
          : { vi: {}, ja: {} }
      };
    }

    async function apiFetchJobs() {
      if (!isSupabaseConfigured()) return null;
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?select=*&order=created_at.desc`,
        { headers: getSupabaseHeaders() }
      );
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const rows = await res.json();
      return Array.isArray(rows) ? rows.map(deserializeJobFromDb) : [];
    }

    async function apiUpsertJob(job) {
      if (!isSupabaseConfigured()) return false;
      const payload = serializeJobForDb(job);
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?on_conflict=id`,
        {
          method: "POST",
          headers: getSupabaseHeaders({ Prefer: "resolution=merge-duplicates,return=representation" }),
          body: JSON.stringify(payload)
        }
      );
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return true;
    }

    async function apiDeleteJob(job) {
      if (!isSupabaseConfigured() || !job) return false;
      const id = encodeURIComponent(job.id || makeJobId(job));
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.${id}`,
        {
          method: "DELETE",
          headers: getSupabaseHeaders({ Prefer: "return=minimal" })
        }
      );
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return true;
    }

    async function apiSeedInitialJobs(list) {
      if (!isSupabaseConfigured()) return false;
      const rows = list.map((item, idx) => ({
        ...serializeJobForDb(item),
        created_at: new Date(Date.now() - idx * 1000).toISOString()
      }));
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?on_conflict=id`,
        {
          method: "POST",
          headers: getSupabaseHeaders({ Prefer: "resolution=merge-duplicates,return=minimal" }),
          body: JSON.stringify(rows)
        }
      );
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return true;
    }

    function matchesLocationFilter(job) {
      if (selectedLocation.type === "all") return true;
      const prefKey = (job.prefecture || "").toLowerCase();
      const jpPref = getJapanesePrefLabel(job.prefecture).toLowerCase();
      const locBlob = `${job.prefecture || ""} ${jpPref} ${job.i18n?.vi?.workplace || ""} ${job.i18n?.ja?.workplace || ""}`.toLowerCase();

      if (selectedLocation.type === "pref") {
        const target = selectedLocation.value.toLowerCase();
        const targetJp = getJapanesePrefLabel(selectedLocation.value).toLowerCase();
        return prefKey === target || locBlob.includes(target) || (targetJp && locBlob.includes(targetJp));
      }

      if (selectedLocation.type === "region") {
        const reg = REGIONS.find(r => r.id === selectedLocation.value);
        if (!reg) return true;
        return reg.prefs.some(p => {
          const pKey = p.key.toLowerCase();
          const pJp = p.ja.toLowerCase();
          return prefKey === pKey || locBlob.includes(pKey) || locBlob.includes(pJp);
        });
      }
      return true;
    }

    function parseManYenFromSalary(salaryStr) {
      if (!salaryStr) return null;
      const s = String(salaryStr);
      const manMatches = [...s.matchAll(/(\d+(?:\.\d+)?)\s*万/g)].map(m => parseFloat(m[1]));
      if (manMatches.length) return Math.max(...manMatches);
      const yenNums = [...s.matchAll(/(\d{2,3}(?:,\d{3})+|\d{5,7})/g)]
        .map(m => parseInt(m[1].replace(/,/g, ""), 10))
        .filter(n => n >= 100000);
      if (yenNums.length) return Math.max(...yenNums) / 10000;
      return null;
    }

    function matchesSalaryFilter(job, rangeKey) {
      if (!rangeKey) return true;
      const d = getJobData(job, currentLang);
      const val = parseManYenFromSalary(d.salary);
      if (val === null) return false;
      if (rangeKey === "15-20") return val >= 15 && val <= 20;
      if (rangeKey === "20-25") return val > 20 && val <= 25;
      if (rangeKey === "25-30") return val > 25 && val <= 30;
      if (rangeKey === "30+") return val >= 30;
      return true;
    }

    function extractMatchedCountries(natStr) {
      const raw = String(natStr || "").trim();
      if (!raw) return [];
      const tokens = raw.split(/[,、/・\s]+/).map(s => s.trim().toLowerCase()).filter(Boolean);
      const matched = [];
      const seen = new Set();

      COUNTRIES.forEach(c => {
        const hit = c.aliases.some(alias =>
          tokens.includes(alias.toLowerCase()) ||
          new RegExp(`(^|[^a-zA-Z])${alias.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}([^a-zA-Z]|$)`, "i").test(raw)
        );
        if (hit && !seen.has(c.code)) {
          seen.add(c.code);
          matched.push(c);
        }
      });
      return matched;
    }

    function formatNationalityCompact(natStr) {
      const tr = t();
      const raw = (natStr || "").trim();
      if (!raw || raw === "—" || /không giới hạn|国籍不問|不問|すべて/i.test(raw)) {
        return `<span>${escapeHtml(tr.noNationalityLimit)}</span>`;
      }
      const matched = extractMatchedCountries(raw);
      if (matched.length) {
        return `<span class="nat-badge-list">${matched.map(renderCountryBadgeHtml).join("")}</span>`;
      }
      return `<span>${escapeHtml(raw)}</span>`;
    }

    function formatGenderCompact(genderStr) {
      const g = (genderStr || "").trim().toLowerCase();
      if (/nam\s*&\s*nữ|nam\/nữ|男女|不問|both/i.test(g)) return "Nam/Nữ";
      if (/nữ|女性|女/i.test(g)) return "Nữ";
      return "Nam";
    }

    function formatBonusRaiseCompact(bonusStr, raiseStr) {
      const tr = t();
      const b = (bonusStr || "").trim();
      const r = (raiseStr || "").trim();
      const hasBonus = b && b !== "—" && !/không|なし|無/i.test(b);
      const hasRaise = r && r !== "—" && !/không|なし|無/i.test(r);

      const bText = hasBonus ? b : tr.noLabel;
      const rText = hasRaise ? r : tr.noLabel;
      if (!hasBonus && !hasRaise) return tr.noLabel;
      return `${bText} / ${rText}`;
    }

    function renderJobs() {
      const tr = t();
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const ind = document.getElementById("industryFilter").value;
      const salRange = document.getElementById("salaryFilter").value;
      const grid = document.getElementById("jobGrid");

      const filtered = JOBS.filter(job => {
        if (activeCategoryTab && job.categoryType !== activeCategoryTab) return false;
        if (ind && job.industry !== ind) return false;
        if (!matchesLocationFilter(job)) return false;
        if (!matchesSalaryFilter(job, salRange)) return false;
        if (!q) return true;

        const natAliases = [
          ...extractMatchedCountries(job.i18n?.vi?.nationality || ""),
          ...extractMatchedCountries(job.i18n?.ja?.nationality || "")
        ].flatMap(c => [c.code, c.vi, c.ja]);

        const blob = [
          job.code,
          job.industry,
          getIndustryLabel(job.industry, "vi"),
          getIndustryLabel(job.industry, "ja"),
          job.prefecture,
          getJapanesePrefLabel(job.prefecture),
          ...natAliases,
          ...Object.values(job.i18n?.vi || {}),
          ...Object.values(job.i18n?.ja || {})
        ].join(" ").toLowerCase();

        return blob.includes(q);
      });

      if (!filtered.length) {
        grid.innerHTML = `<div class="card"><p>${escapeHtml(tr.noResult)}</p></div>`;
        return;
      }

      grid.innerHTML = filtered.map(job => {
        const idx = JOBS.indexOf(job);
        const d = getJobData(job, currentLang);
        const statusClass = getStatusClass(job.status);
        const closedClass = job.status === "Đóng đơn" ? "is-closed" : "";
        const prefCompact = getPrefLabel(job.prefecture, currentLang);
        const indCompact = getIndustryLabel(job.industry, currentLang);
        const titleLine = `${job.code} | ${prefCompact} | ${indCompact}`;

        return `
          <article id="job-card-${escapeAttr(job.code)}" class="card ${closedClass}">
            <div>
              <div class="card-top">
                <h2 class="card-title-compact">${escapeHtml(titleLine)}</h2>
                <span class="status-badge ${statusClass}">${escapeHtml(getStatusText(job.status))}</span>
              </div>

              <div class="compact-list">
                <div class="compact-row"><strong>${escapeHtml(tr.cardLabels.salary)}:</strong> <span>${escapeHtml(d.salary || "—")}</span></div>
                <div class="compact-row"><strong>${escapeHtml(tr.cardLabels.nationality)}:</strong> ${formatNationalityCompact(d.nationality)}</div>
                <div class="compact-row"><strong>${escapeHtml(tr.cardLabels.gender)}:</strong> <span>${escapeHtml(formatGenderCompact(d.gender))}</span></div>
                <div class="compact-row"><strong>${escapeHtml(tr.cardLabels.bonusRaise)}:</strong> <span>${escapeHtml(formatBonusRaiseCompact(d.bonus, d.raise))}</span></div>
              </div>

              ${isAdminVerified ? `
                <div class="admin-card-bar">
                  <select aria-label="Status ${escapeAttr(job.code)}" onchange="updateJobStatus(${idx}, this.value)">
                    <option value="Đang tuyển" ${job.status === "Đang tuyển" ? "selected" : ""}>${escapeHtml(tr.statusLabels["Đang tuyển"])}</option>
                    <option value="Đóng đơn" ${job.status === "Đóng đơn" ? "selected" : ""}>${escapeHtml(tr.statusLabels["Đóng đơn"])}</option>
                  </select>
                  <button type="button" class="btn-secondary" onclick="openEditorModal(${idx})">${escapeHtml(tr.editAction)}</button>
                  <button type="button" class="btn-danger-sm" onclick="deleteJob(${idx})">${escapeHtml(tr.deleteAction)}</button>
                </div>
              ` : ""}
            </div>

            <div class="card-actions-row">
              <button type="button" class="btn-primary" onclick="copyJob('${escapeAttr(job.code)}')">${escapeHtml(tr.copyBtn)}</button>
              <button type="button" class="btn-detail" onclick="openDetailModal('${escapeAttr(job.code)}')">${escapeHtml(tr.detailBtn)}</button>
              <button type="button" class="btn-snap" onclick="captureCardImage('${escapeAttr(job.code)}')">${escapeHtml(tr.snapCardBtn)}</button>
            </div>
          </article>
        `;
      }).join("");
    }

    function buildDetailRows17(job) {
      const tr = t();
      const d = getJobData(job, currentLang);
      const fields = tr.detailFields;
      const values = [
        getStatusText(job.status),
        d.title,
        job.code,
        getIndustryLabel(job.industry),
        getPrefLabel(job.prefecture),
        d.workplace,
        d.jobDesc,
        d.nationality || tr.noNationalityLimit,
        d.japanese,
        d.headcount,
        d.salary,
        d.bonus,
        d.raise,
        d.overtime,
        d.housing,
        d.shift,
        [d.experience, d.note].filter(Boolean).join(" | ")
      ];

      return fields.map((label, idx) => ({
        label,
        value: values[idx] && String(values[idx]).trim() ? String(values[idx]).trim() : "—"
      }));
    }

    function openDetailModal(code) {
      const job = JOBS.find(item => item.code === code);
      if (!job) return;
      activeDetailJob = job;

      const tr = t();
      const rows = buildDetailRows17(job);
      document.getElementById("detailModalBody").innerHTML = `
        <table class="detail-table">
          <thead>
            <tr>
              <th>${escapeHtml(tr.colItem)}</th>
              <th>${escapeHtml(tr.colValue)}</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <th>${escapeHtml(r.label)}</th>
                <td>${escapeHtml(r.value)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;

      document.getElementById("detailModal").classList.add("show");
    }

    function printSingleJob(code) {
      const targetCode = code || activeDetailJob?.code;
      const job = JOBS.find(item => item.code === targetCode);
      if (!job) return;

      const tr = t();
      const rows = buildDetailRows17(job);
      document.getElementById("printOnlyArea").innerHTML = `
        <div class="print-doc-header">
          <div class="print-doc-brand">${escapeHtml(tr.brand)}</div>
          <div class="print-doc-title">${escapeHtml(tr.detailHeading)} — ${escapeHtml(job.code)}</div>
        </div>
        <table class="print-table">
          <tbody>
            ${rows.map(r => `
              <tr>
                <th>${escapeHtml(r.label)}</th>
                <td>${escapeHtml(r.value)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
      window.print();
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove("show");
    }

    function handleBackdropClick(event, modalId) {
      if (event.target.id === modalId) closeModal(modalId);
    }

    function buildShareText(job) {
      const tr = t();
      const d = getJobData(job, currentLang);
      const lines = [
        `${job.code} | ${getPrefLabel(job.prefecture)} | ${getIndustryLabel(job.industry)}`,
        `${tr.detailFields[0]}: ${getStatusText(job.status)}`,
        `${tr.detailFields[1]}: ${d.title}`,
        `${tr.detailFields[5]}: ${d.workplace}`,
        `${tr.detailFields[6]}: ${d.jobDesc}`,
        `${tr.detailFields[7]}: ${d.nationality || tr.noNationalityLimit}`,
        `${tr.cardLabels.gender}: ${formatGenderCompact(d.gender)}`,
        `${tr.detailFields[8]}: ${d.japanese}`,
        `${tr.detailFields[9]}: ${d.headcount}`,
        `${tr.detailFields[10]}: ${d.salary}`,
        `${tr.detailFields[11]}: ${d.bonus}`,
        `${tr.detailFields[12]}: ${d.raise}`,
        `${tr.detailFields[13]}: ${d.overtime}`,
        `${tr.detailFields[14]}: ${d.housing}`,
        `${tr.detailFields[15]}: ${d.shift}`,
        d.note ? `${tr.detailFields[16]}: ${d.note}` : ""
      ].filter(Boolean);
      return lines.join("\n");
    }

    function copyJob(code) {
      const job = JOBS.find(item => item.code === code);
      if (!job) return;
      navigator.clipboard?.writeText(buildShareText(job));
      showToast(t().copiedToast);
    }

    function copyCurrentDetailJob() {
      if (!activeDetailJob) return;
      copyJob(activeDetailJob.code);
    }

    async function exportElementAsImage(element, filename) {
      const tr = t();
      if (typeof window.html2canvas !== "function" || !element) {
        showToast(tr.snapFallbackToast);
        return;
      }
      try {
        const canvas = await window.html2canvas(element, {
          scale: 2,
          useCORS: true,
          backgroundColor: "#ffffff",
          scrollX: 0,
          scrollY: 0,
          windowWidth: element.scrollWidth,
          windowHeight: element.scrollHeight
        });
        const link = document.createElement("a");
        link.download = filename;
        link.href = canvas.toDataURL("image/png");
        link.click();
        showToast(tr.snapSuccessToast);
      } catch (err) {
        showToast(tr.snapFallbackToast);
      }
    }

    function captureCardImage(code) {
      exportElementAsImage(document.getElementById(`job-card-${code}`), `Minami_Kyujin_${code}_${currentLang}.png`);
    }

    function captureDetailImage() {
      if (!activeDetailJob) return;
      const box = document.getElementById("detailModalBox");
      const prevMaxH = box.style.maxHeight;
      const prevOverflow = box.style.overflowY;
      box.style.maxHeight = "none";
      box.style.overflowY = "visible";

      exportElementAsImage(box, `Minami_Kyujin_Detail_${activeDetailJob.code}_${currentLang}.png`).finally(() => {
        box.style.maxHeight = prevMaxH;
        box.style.overflowY = prevOverflow;
      });
    }

    function handleAdminAuthClick() {
      if (isAdminVerified) {
        isAdminVerified = false;
        closeModal("updateManagerModal");
        showToast(t().adminLoggedOutToast);
        syncAllUI();
        return;
      }
      document.getElementById("adminPassInput").value = "";
      document.getElementById("loginModal").classList.add("show");
    }

    function verifyAdminPass() {
      const code = document.getElementById("adminPassInput").value;
      if (code === getAdminPasscode()) {
        isAdminVerified = true;
        closeModal("loginModal");
        showToast(t().adminEnabledToast);
        syncAllUI();
      } else {
        showToast(t().adminWrongPassToast);
      }
    }

    function promptChangePasscode() {
      if (!isAdminVerified) return;
      const tr = t();
      const promptMsg = currentLang === "ja"
        ? "新しい管理者認証コードを入力してください："
        : "Nhập mã xác thực quản trị viên mới:";
      const nextPass = window.prompt(promptMsg, getAdminPasscode());
      if (nextPass === null) return;
      const trimmed = nextPass.trim();
      if (!trimmed) {
        showToast(tr.passEmptyToast);
        return;
      }
      setAdminPasscode(trimmed);
      showToast(tr.passChangedToast);
    }

    async function restoreDefaultJobs() {
      if (!isAdminVerified) return;
      const confirmMsg = currentLang === "ja"
        ? "初期求人データに復元しますか？（現在の追加・編集内容は上書きされます）"
        : "Khôi phục dữ liệu đơn tuyển gốc? (Các thay đổi hiện tại sẽ được ghi đè)";
      if (!window.confirm(confirmMsg)) return;
      JOBS = cloneJobs(INITIAL_JOBS);
      saveCachedJobs();
      try {
        await apiSeedInitialJobs(JOBS);
      } catch (e) {
        showToast(t().cloudSyncErrorToast);
      }
      showToast(t().restoredToast);
      renderJobs();
      renderUpdateManagerList();
    }

    function handleUpdateClick() {
      if (!isAdminVerified) {
        document.getElementById("adminPassInput").value = "";
        document.getElementById("loginModal").classList.add("show");
        return;
      }
      renderUpdateManagerList();
      document.getElementById("updateManagerModal").classList.add("show");
    }

    function renderUpdateManagerList() {
      const tr = t();
      const body = document.getElementById("updateJobListBody");
      body.innerHTML = `
        <table class="detail-table">
          <thead>
            <tr>
              <th>${escapeHtml(tr.detailFields[2])}</th>
              <th>${escapeHtml(tr.detailFields[0])}</th>
              <th>${escapeHtml(tr.colValue)}</th>
            </tr>
          </thead>
          <tbody>
            ${JOBS.map((job, idx) => {
              const d = getJobData(job, currentLang);
              return `
                <tr>
                  <td><strong>${escapeHtml(job.code)}</strong></td>
                  <td>
                    <select onchange="updateJobStatus(${idx}, this.value)">
                      <option value="Đang tuyển" ${job.status === "Đang tuyển" ? "selected" : ""}>${escapeHtml(tr.statusLabels["Đang tuyển"])}</option>
                      <option value="Đóng đơn" ${job.status === "Đóng đơn" ? "selected" : ""}>${escapeHtml(tr.statusLabels["Đóng đơn"])}</option>
                    </select>
                  </td>
                  <td>
                    <div style="margin-bottom:6px;">${escapeHtml(`${getPrefLabel(job.prefecture)} | ${getIndustryLabel(job.industry)} — ${d.title}`)}</div>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                      <button type="button" class="btn-secondary" onclick="openEditorModal(${idx})">${escapeHtml(tr.editAction)}</button>
                      <button type="button" class="btn-danger-sm" onclick="deleteJob(${idx})">${escapeHtml(tr.deleteAction)}</button>
                    </div>
                  </td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      `;
    }

    async function updateJobStatus(index, newStatus) {
      if (!isAdminVerified || !JOBS[index]) return;
      JOBS[index].status = newStatus === "Đóng đơn" ? "Đóng đơn" : "Đang tuyển";
      saveCachedJobs();
      renderJobs();
      if (document.getElementById("updateManagerModal").classList.contains("show")) {
        renderUpdateManagerList();
      }
      try {
        await apiUpsertJob(JOBS[index]);
        showToast(t().statusUpdatedToast);
      } catch (e) {
        showToast(t().cloudSyncErrorToast);
      }
    }

    async function deleteJob(index) {
      if (!isAdminVerified || !JOBS[index]) return;
      const [removed] = JOBS.splice(index, 1);
      saveCachedJobs();
      renderJobs();
      if (document.getElementById("updateManagerModal").classList.contains("show")) {
        renderUpdateManagerList();
      }
      try {
        await apiDeleteJob(removed);
        showToast(t().deletedToast);
      } catch (e) {
        showToast(t().cloudSyncErrorToast);
      }
    }

    function openEditorModal(index = null) {
      if (!isAdminVerified) return;
      const tr = t();
      const isEdit = typeof index === "number" && JOBS[index];
      document.getElementById("editorModalTitle").textContent = isEdit ? tr.editorEditTitle : tr.editorAddTitle;
      document.getElementById("editJobIndex").value = isEdit ? String(index) : "";

      const base = isEdit ? JOBS[index] : {
        code: "",
        categoryType: activeCategoryTab === "engineer" ? "engineer" : "tokutei",
        status: "Đang tuyển",
        industry: "Kaigo",
        prefecture: "Tokyo",
        i18n: { vi: {}, ja: {} }
      };
      const d = getJobData(base, currentLang);

      document.getElementById("editCode").value = base.code || "";
      document.getElementById("editStatus").value = base.status === "Đóng đơn" ? "Đóng đơn" : "Đang tuyển";
      document.getElementById("editCategoryType").value = base.categoryType === "engineer" ? "engineer" : "tokutei";
      document.getElementById("editTitle").value = d.title || "";
      document.getElementById("editIndustry").value = base.industry || "Kaigo";
      document.getElementById("editPref").value = base.prefecture || "Tokyo";
      document.getElementById("editLocation").value = d.workplace || "";
      document.getElementById("editNat").value = d.nationality || "";
      document.getElementById("editGender").value = formatGenderCompact(d.gender);
      document.getElementById("editHeadcount").value = d.headcount || "";
      document.getElementById("editSalary").value = d.salary || "";
      document.getElementById("editBonus").value = d.bonus || "";
      document.getElementById("editRaise").value = d.raise || "";
      document.getElementById("editOvertime").value = d.overtime || "";
      document.getElementById("editHousing").value = d.housing || "";
      document.getElementById("editShift").value = d.shift || "";
      document.getElementById("editReq").value = d.experience || "";
      document.getElementById("editNote").value = d.note || "";

      document.getElementById("editorModal").classList.add("show");
    }

    async function saveEditedJob(event) {
      event.preventDefault();
      if (!isAdminVerified) return;

      const idxVal = document.getElementById("editJobIndex").value;
      const code = document.getElementById("editCode").value.trim();
      const status = document.getElementById("editStatus").value === "Đóng đơn" ? "Đóng đơn" : "Đang tuyển";
      const categoryType = document.getElementById("editCategoryType").value === "engineer" ? "engineer" : "tokutei";
      const industry = document.getElementById("editIndustry").value;
      const prefecture = document.getElementById("editPref").value;

      const patch = {
        title: document.getElementById("editTitle").value.trim(),
        workplace: document.getElementById("editLocation").value.trim(),
        jobDesc: document.getElementById("editTitle").value.trim(),
        nationality: document.getElementById("editNat").value.trim(),
        gender: document.getElementById("editGender").value,
        headcount: document.getElementById("editHeadcount").value.trim(),
        salary: document.getElementById("editSalary").value.trim(),
        bonus: document.getElementById("editBonus").value.trim(),
        raise: document.getElementById("editRaise").value.trim(),
        overtime: document.getElementById("editOvertime").value.trim(),
        housing: document.getElementById("editHousing").value.trim(),
        shift: document.getElementById("editShift").value.trim(),
        experience: document.getElementById("editReq").value.trim(),
        note: document.getElementById("editNote").value.trim()
      };

      let savedJob;
      if (idxVal !== "" && JOBS[Number(idxVal)]) {
        const target = JOBS[Number(idxVal)];
        target.code = code;
        target.status = status;
        target.categoryType = categoryType;
        target.industry = industry;
        target.prefecture = prefecture;
        target.id = target.id || makeJobId(target);
        target.i18n[currentLang] = { ...(target.i18n[currentLang] || {}), ...patch };
        savedJob = target;
      } else {
        savedJob = {
          id: `${makeJobId({ code, prefecture, industry })}-${Date.now()}`,
          code,
          categoryType,
          status,
          company: "Minami Kyujn Share",
          industry,
          prefecture,
          link: "",
          i18n: {
            vi: { japanese: "—", ...patch },
            ja: { japanese: "—", ...patch }
          }
        };
        JOBS.unshift(savedJob);
      }

      saveCachedJobs();
      closeModal("editorModal");
      renderJobs();
      if (document.getElementById("updateManagerModal").classList.contains("show")) {
        renderUpdateManagerList();
      }
      try {
        await apiUpsertJob(savedJob);
        showToast(t().savedToast);
      } catch (e) {
        showToast(t().cloudSyncErrorToast);
      }
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/`/g, "&#96;");
    }

    async function initApp() {
      syncAllUI();
      if (!isSupabaseConfigured()) return;
      try {
        const remoteJobs = await apiFetchJobs();
        if (Array.isArray(remoteJobs)) {
          if (remoteJobs.length > 0) {
            JOBS = remoteJobs;
            saveCachedJobs();
            renderJobs();
          } else if (JOBS.length > 0) {
            await apiSeedInitialJobs(JOBS);
          }
        }
      } catch (e) {
        // Giữ dữ liệu cache nếu mất kết nối tạm thời
      }
    }

    initApp();
  </script>
</body>
</html>
